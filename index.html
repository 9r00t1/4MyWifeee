<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080003">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Pirata+One&display=swap" rel="stylesheet">
<title>Love Heart</title>
<style>
  /* Layout: full-bleed black stage. Backdrop glow, blurred glow copy, sharp text canvas on top,
     a hint line and a replay control at the bottom. Single deliberate look (red on black). */
  :root {
    --bg: #080003;
    --ink: #b3122c;
    --flash: #e8a0b0;
    --muted: #86404f;
    --font: "Cinzel", "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    overflow: hidden;
  }
  .stage { position: relative; height: 100%; }
  .halo {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: radial-gradient(ellipse 46% 40% at 50% 46%, rgba(168,0,34,.42), rgba(90,0,18,.16) 55%, transparent 75%);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { filter: blur(10px) saturate(1.6) brightness(1.7); opacity: .95; pointer-events: none; }
  #c { touch-action: none; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      radial-gradient(ellipse 88% 78% at 50% 46%, transparent 46%, rgba(8,0,3,.45) 76%, rgba(4,0,2,.9) 100%);
  }
  .foot {
    z-index: 6; position: absolute; left: 0; right: 0; bottom: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .hint { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-align: center; }
  button {
    pointer-events: auto;
    background: transparent; color: var(--muted);
    border: 1px solid var(--muted); border-radius: 2px;
    font: 600 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase;
    padding: 9px 14px; cursor: pointer;
  }
  button:hover { color: var(--ink); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--flash); outline-offset: 2px; }
  .btns { display: flex; gap: 10px; }
  .hint.pulse { color: var(--ink); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .hint.pulse { animation: none; } }
  #splash {
    position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: var(--bg); color: var(--ink); border: 0; border-radius: 0; padding: 0;
    pointer-events: auto; transition: opacity .6s ease; -webkit-tap-highlight-color: transparent;
  }
  #splash[hidden] { display: none; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash svg { width: 96px; height: 96px; filter: drop-shadow(0 0 22px rgba(168,0,34,.85)); animation: beat 1.15s ease-in-out infinite; }
  #splash .t1 { font: 600 20px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  #splash .t2 { font: 400 13px/1.2 var(--font); letter-spacing: .06em; text-transform: none; color: var(--muted); }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
</style>
</head>
<body>

<div class="stage">
  <div class="halo" id="halo"></div>
  <canvas id="glow" aria-hidden="true"></canvas>
  <canvas id="c" aria-label="A heart made of the words I love you in 75 languages. It beats, and the words move away from your cursor."></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="foot">
    <div class="hint" id="hint">Move over the heart. Tap or click to burst.</div>
    <div class="btns">
      <button id="replay" type="button">Replay</button>
      <button id="sound" type="button" aria-pressed="false">Sound on</button>
    </div>
  </div>
</div>

<button id="splash" type="button" aria-label="Tap to open with sound">
  <svg viewBox="0 0 32 29" aria-hidden="true"><path fill="#8f0a22" d="M16 28.5C-8 12 4.5-3 16 6.5 27.5-3 40 12 16 28.5z"/></svg>
  <span class="t1">Tap to open</span>
  <span class="t2">turn your sound on</span>
</button>

  function rng(seed) {
    return function () {

      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

    POLY.push([Math.pow(Math.sin(t0), 3),

  function layout() {

          for (var at = 0; at < 8 && txt === null; at++) {      // find the next language that fits the space left

  function ambient() {
    for (var tries = 0; tries < 12; tries++) {
      var x = CX + (Math.random() * 2 - 1) * S, y = CY + (Math.random() * 1.8 - 0.75) * S;
      if (inside(x, y)) {
        spawn(x, y, (Math.random() - .5) * 8, -(10 + Math.random() * 22), 1.2 + Math.random() * 2.2, 2200 + Math.random() * 1800, Math.random() < .35 ? "heart" : "spark");
        return;
      }
    }
  }
  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 200;
      spawn(x, y, Math.cos(a) * v, Math.sin(a) * v - 30, 3 + Math.random() * 5, 1200 + Math.random() * 900, Math.random() < .65 ? "heart" : "spark");
    }
  }

  // ---- per-frame helpers ----
  function beatPhase(now) { return ((now - startT) % BEAT_MS) / BEAT_MS; }
  function pulse(ph) {
    return Math.exp(-Math.pow((ph - 0.05) / 0.05, 2)) + 0.62 * Math.exp(-Math.pow((ph - 0.25) / 0.05, 2));
  }
  function lerp(a, b, k) { return a + (b - a) * k; }

  function draw(now) {
    var dt = Math.min(48, now - (lastTick || now)); lastTick = now;
    var elapsed = now - startT, done = elapsed > REVEAL_MS + FADE_MS;
    var ph = beatPhase(now), p = reduced ? 0 : pulse(ph) * (Math.min(1, elapsed / 1500));
    var scale = 1 + 0.045 * p;
    var waveR = ph < 0.62 ? (ph / 0.62) * 1.25 * S : -1;
    var waveK = ph < 0.62 ? (1 - ph / 0.62) : 0;
    halo.style.opacity = (0.42 + 0.4 * p).toFixed(3);

    if (!reduced) {
      if (now - lastSpawn > 70) { lastSpawn = now; if (done || elapsed > 1500) ambient(); }
      if (done && now - lastTwinkle > 380) {
        lastTwinkle = now;
        var tw = items[Math.floor(Math.random() * items.length)]; if (tw) tw.flash = now;
      }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(MX, MY); ctx.scale(scale, scale); ctx.translate(-MX, -MY);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";

    var REPEL = Math.max(70, S * 0.3), lastFont = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i], age;
      if (reduced) age = FADE_MS;
      else {
        age = elapsed - it.t;
        if (age < 0) continue;
        if (it.flash !== null && now - it.flash < 1200) age = Math.min(age, now - it.flash);
      }
      var k = Math.min(1, age / FADE_MS);               // 0 fresh and bright, 1 settled

      // pointer repel (screen space) with a spring back
      var cxs = it.x + it.w / 2, cys = it.y, tx = 0, ty = 0;
      if (ptr.on && !reduced) {
        var sx = MX + (cxs - MX) * scale, sy = MY + (cys - MY) * scale;
        var ddx = sx - ptr.x, ddy = sy - ptr.y, dd = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dd < REPEL && dd > 0.01) { var f = Math.pow(1 - dd / REPEL, 2) * REPEL * 0.55; tx = ddx / dd * f; ty = ddy / dd * f; }
      }
      // click shockwaves push words outward as the ring passes
      for (var s = 0; s < shocks.length; s++) {
        var sh = shocks[s], rr = (now - sh.t) * 0.55, sdx = cxs - sh.x, sdy = cys - sh.y;
        var sd = Math.sqrt(sdx * sdx + sdy * sdy), band = Math.exp(-Math.pow((sd - rr) / 36, 2)) * Math.max(0, 1 - (now - sh.t) / 900);
        if (band > 0.01 && sd > 0.01) { tx += sdx / sd * band * 16; ty += sdy / sd * band * 16; }
      }
      it.ox += (tx - it.ox) * 0.16; it.oy += (ty - it.oy) * 0.16;

      // colour: deep red at the rim, warmer pink toward the centre, brightened by the beat ring and new words
      var base = 1 - Math.min(1, it.d);
      var r = lerp(140, 190, base), g = lerp(0, 8, base), b = lerp(26, 42, base);   // burgundy rim to deep crimson centre
      var boost = 0;
      if (waveR >= 0) boost = Math.exp(-Math.pow((it.d * S - waveR) / (0.16 * S), 2)) * waveK * 0.85;
      boost = Math.max(boost, 1 - k);
      r = lerp(r, 255, boost); g = lerp(g, 96, boost); b = lerp(b, 122, boost);   // soft rose-red glint on the beat

      var fnt = "400 " + it.fs.toFixed(1) + "px " + FAMILY;
      if (fnt !== lastFont) { ctx.font = fnt; lastFont = fnt; }
      ctx.fillStyle = "rgb(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ")";
      ctx.fillText(it.txt, it.x + it.ox, it.y + it.oy);
    }
    ctx.restore();

    // particles (screen space, drawn above the words)
    for (var q = parts.length - 1; q >= 0; q--) {
      var pt = parts[q]; pt.age += dt;
      if (pt.age >= pt.life) { parts.splice(q, 1); continue; }
      var u = pt.age / pt.life, a = Math.sin(Math.PI * Math.min(1, u * 1.15)) * (pt.kind === "heart" ? 0.95 : 0.8);
      pt.x += pt.vx * dt / 1000; pt.y += pt.vy * dt / 1000;
      pt.vx *= 0.995; pt.vy = pt.vy * 0.995 + (pt.kind === "heart" && pt.life < 2200 ? 26 : 0) * dt / 1000;
      ctx.globalAlpha = Math.max(0, a);
      if (pt.kind === "heart") { ctx.fillStyle = "#a80022"; heartPath(ctx, pt.x, pt.y, pt.s * (1 - 0.3 * u)); ctx.fill(); }
      else { ctx.fillStyle = "#d98ea0"; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.s * 0.6, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (var h = shocks.length - 1; h >= 0; h--) if (now - shocks[h].t > 900) shocks.splice(h, 1);

    // blurred copy of the whole frame gives the neon glow
    gctx.clearRect(0, 0, glow.width, glow.height);
    gctx.drawImage(canvas, 0, 0, glow.width, glow.height);

    if (!reduced) requestAnimationFrame(draw);
  }

  function play() {
    startT = performance.now(); parts.length = 0; shocks.length = 0;
    items.forEach(function (i) { i.flash = null; i.ox = i.oy = 0; });
    if (reduced) draw(startT);
  }

  function setPtr(e) {
    var r = canvas.getBoundingClientRect();
    ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.on = true;
    if (!reduced && Math.hypot(ptr.x - ptr.lx, ptr.y - ptr.ly) > 14) {
      ptr.lx = ptr.x; ptr.ly = ptr.y;
      spawn(ptr.x, ptr.y, (Math.random() - .5) * 30, -10 - Math.random() * 20, 1 + Math.random() * 1.6, 700 + Math.random() * 500, "spark");
    }
  }
  canvas.addEventListener("pointermove", setPtr);
  canvas.addEventListener("pointerdown", function (e) {
    setPtr(e);
    if (reduced) return;
    shocks.push({ x: ptr.x, y: ptr.y, t: performance.now() });
    burst(ptr.x, ptr.y, 22);
  });
  canvas.addEventListener("pointerleave", function () { ptr.on = false; });
  canvas.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") ptr.on = false; });

  window.addEventListener("resize", function () { layout(); if (reduced) draw(performance.now()); });
  document.getElementById("replay").addEventListener("click", function () { play(); try { bgm.currentTime = 0; } catch (e) {} if (!muted) startAudio(); });

  // ---- background music: phones block sound until the first tap, so a "Tap to open" screen starts audio + animation together ----
  var bgm = document.getElementById("bgm"), soundBtn = document.getElementById("sound"), hint = document.getElementById("hint");
  var splash = document.getElementById("splash");
  var HINT_TXT = hint.textContent, muted = false, started = false;
  bgm.volume = 0.9;
  function syncUI() {
    soundBtn.textContent = (muted || !started) ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-pressed", String(started && !muted));
  }
  function hideSplash() {
    if (splash.hidden || splash.classList.contains("gone")) return;
    splash.classList.add("gone");
    setTimeout(function () { splash.hidden = true; }, 700);
  }
  function startAudio() {
    if (muted) return Promise.resolve();
    var p = bgm.play();
    return (p && p.then ? p : Promise.resolve()).then(function () {
      started = true; hint.textContent = HINT_TXT; hint.classList.remove("pulse"); syncUI(); unlock(false); hideSplash();
    }, function () {
      started = false; syncUI(); unlock(true);
      if (splash.hidden || splash.classList.contains("gone")) { hint.textContent = "Tap anywhere to start the music"; hint.classList.add("pulse"); }
    });
  }
  function onFirstGesture() { startAudio(); }
  function unlock(on) {
    ["touchend", "click", "keydown"].forEach(function (ev) {
      document[on ? "addEventListener" : "removeEventListener"](ev, onFirstGesture, true);
    });
  }
  splash.addEventListener("click", function () {
    muted = false;
    try { bgm.currentTime = 0; } catch (e) {}
    startAudio();            // called straight from the tap, which is what phones require
    play();                  // restart the heart animation in sync with the music
    hideSplash();
  });
  soundBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (started && !muted) { muted = true; bgm.pause(); }
    else { muted = false; startAudio(); }
    syncUI();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) bgm.pause(); else if (started && !muted) bgm.play().catch(function () {});
  });
  startAudio();              // works on desktop browsers that allow autoplay; the splash hides itself then

  function boot() { layout(); startT = performance.now(); if (reduced) draw(startT); else requestAnimationFrame(draw); }
  // wait for the gothic font so the words are measured with it (falls back after 2.5 s)
  var pageLoaded = document.readyState === "complete" ? Promise.resolve() : new Promise(function (r) { window.addEventListener("load", r); });
  var fontWait = Promise.race([
    pageLoaded.then(function () { return document.fonts && document.fonts.load ? document.fonts.load('400 24px "Pirata One"') : null; }),
    new Promise(function (r) { setTimeout(r, 2500); })
  ]);
  fontWait.then(boot, boot);
})();
</script>
</body>
</html>
